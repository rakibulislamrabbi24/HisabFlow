name: Build HisabFlow APK

on:
  push:
    paths:
      - '**.zip'
      - '**.ZIP'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find latest ZIP
        id: zip
        run: |
          BEST=""
          BEST_TIME=0
          while IFS= read -r f; do
            T=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
            T=${T:-0}
            if [ "$T" -ge "$BEST_TIME" ]; then BEST="$f"; BEST_TIME="$T"; fi
          done < <(find . -type f -iname "*.zip" -not -path "./.git/*" -not -path "./project/*")
          if [ -z "$BEST" ]; then
            echo "::error::রিপোতে কোনো ZIP ফাইল পাওয়া যায়নি। HisabFlow.zip আপলোড করুন।"
            exit 1
          fi
          echo "ZIP=$BEST"
          echo "path=$BEST" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        id: root
        run: |
          rm -rf project && mkdir project
          unzip -q "${{ steps.zip.outputs.path }}" -d project
          PKG=$(find project -maxdepth 3 -name package.json -not -path "*/node_modules/*" | head -n1)
          if [ -z "$PKG" ]; then echo "package.json পাওয়া যায়নি"; exit 1; fi
          echo "dir=$(dirname "$PKG")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: ${{ steps.root.outputs.dir }}
        run: npm install

      - name: Build web assets
        working-directory: ${{ steps.root.outputs.dir }}
        run: npm run build

      - name: Add Android platform (if missing), apply icons, permissions and sync
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          if [ -d android-res ]; then
            rm -f android/app/src/main/res/mipmap-*/ic_launcher*.png
            cp -r android-res/. android/app/src/main/res/
          fi
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q "USE_BIOMETRIC" "$MANIFEST" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n</manifest>#' "$MANIFEST"
          npx cap sync android

      - name: Build debug APK
        working-directory: ${{ steps.root.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          APK=$(find "${{ steps.root.outputs.dir }}/android" -name "app-debug.apk" | head -n1)
          cp "$APK" HisabFlow.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HisabFlow-APK
          path: HisabFlow.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HisabFlow build ${{ github.run_number }}
          files: HisabFlow.apk
