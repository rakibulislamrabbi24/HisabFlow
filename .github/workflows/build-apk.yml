name: Build HisabFlow APK

on:
  push:
    paths:
      - '**.zip'
      - '**.ZIP'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- ১) সাইনিং সিক্রেট আছে কিনা আগেই দেখা ----------
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::সাইনিং সিক্রেট সেট করা নেই:$missing — Settings → Secrets and variables → Actions থেকে যোগ করুন (গাইড দেখুন)।"
            exit 1
          fi
          # মান না দেখিয়ে শুধু দৈর্ঘ্য ও অদৃশ্য/বিদেশি অক্ষরের সংখ্যা (কপি-পেস্টের ভুল ধরার জন্য)
          diag() {
            bad=$(printf '%s' "$2" | LC_ALL=C tr -d '\040-\176' | wc -c | tr -d ' ')
            echo "$1: দৈর্ঘ্য=${#2}, ASCII-বহির্ভূত/অদৃশ্য বাইট=$bad"
          }
          diag KEYSTORE_PASSWORD "$KEYSTORE_PASSWORD"
          diag KEYSTORE_BASE64 "$KEYSTORE_BASE64"
          echo "সাইনিং সিক্রেট আছে ✓ (KEY_ALIAS ও KEY_PASSWORD সিক্রেট আর লাগে না, থাকলে উপেক্ষা করা হয়)"

      # ---------- ২) সবচেয়ে নতুন ZIP খোঁজা ও খোলা ----------
      - name: Find latest ZIP
        id: zip
        run: |
          BEST=""
          BEST_TIME=0
          while IFS= read -r f; do
            T=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
            T=${T:-0}
            if [ "$T" -ge "$BEST_TIME" ]; then BEST="$f"; BEST_TIME="$T"; fi
          done < <(find . -type f -iname "*.zip" -not -path "./.git/*" -not -path "./project/*")
          if [ -z "$BEST" ]; then
            echo "::error::রিপোতে কোনো ZIP ফাইল পাওয়া যায়নি। HisabFlow.zip আপলোড করুন।"
            exit 1
          fi
          echo "ZIP=$BEST"
          echo "path=$BEST" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        id: root
        run: |
          rm -rf project && mkdir project
          unzip -q "${{ steps.zip.outputs.path }}" -d project
          PKG=$(find project -maxdepth 3 -name package.json -not -path "*/node_modules/*" | head -n1)
          if [ -z "$PKG" ]; then echo "::error::package.json পাওয়া যায়নি"; exit 1; fi
          echo "dir=$(dirname "$PKG")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ---------- ৩) ওয়েব বিল্ড ----------
      - name: Install dependencies
        working-directory: ${{ steps.root.outputs.dir }}
        run: npm install

      - name: Build web assets
        working-directory: ${{ steps.root.outputs.dir }}
        run: npm run build

      # ---------- ৪) Android প্রজেক্ট, আইকন, ভার্সন ----------
      - name: Add Android platform, apply icons, set version, sync
        id: android
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          if [ -d android-res ]; then
            rm -f android/app/src/main/res/mipmap-*/ic_launcher*.png
            cp -r android-res/. android/app/src/main/res/
          fi
          VERSION=$(node -p "require('./package.json').version")
          VERSION_CODE=$(date -u +%y%j%H%M)
          GRADLE=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/; s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" "$GRADLE"
          grep -nE "versionCode|versionName" "$GRADLE"
          if ! grep -q "versionCode ${VERSION_CODE}" "$GRADLE"; then
            echo "::error::versionCode বসানো যায়নি — android/app/build.gradle দেখুন"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          npx cap sync android

      # ---------- ৫) APK বিল্ড (আগে release, না হলে debug) ----------
      - name: Build APK
        id: gradle
        working-directory: ${{ steps.root.outputs.dir }}/android
        run: |
          chmod +x gradlew
          if ./gradlew assembleRelease --no-daemon; then
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::release বিল্ড ব্যর্থ হয়েছে, debug বিল্ড দিয়ে চেষ্টা করা হচ্ছে"
            ./gradlew assembleDebug --no-daemon
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      # ---------- ৬) স্থায়ী কী দিয়ে সাইন ----------
      - name: Sign APK with the permanent key
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -eu
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -n1)
          echo "build-tools: $BT"

          APKDIR="${{ steps.root.outputs.dir }}/android/app/build/outputs/apk/${{ steps.gradle.outputs.variant }}"
          IN=$(find "$APKDIR" -name "*.apk" | head -n1)
          if [ -z "$IN" ]; then echo "::error::APK ফাইল পাওয়া যায়নি ($APKDIR)"; exit 1; fi
          echo "input APK: $IN"

          # কপি-পেস্টে ঢুকে যাওয়া অদৃশ্য অক্ষর, নতুন লাইন বা ফাঁকা বাদ দেওয়া
          KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | LC_ALL=C tr -cd '\041-\176')
          export KEYSTORE_PASSWORD
          printf '%s' "$KEYSTORE_BASE64" | LC_ALL=C tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/release.jks"

          # সাইন করার আগেই কী-স্টোর খুলে দেখা, যাতে ভুল হলে পরিষ্কার বার্তা আসে
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass:env KEYSTORE_PASSWORD > "$RUNNER_TEMP/kt.log" 2>&1; then
            echo "::error::কী-স্টোর খোলা যায়নি। KEYSTORE_PASSWORD বা KEYSTORE_BASE64 ভুল। দুটি সিক্রেট মুছে নতুন করে বসান (পাসওয়ার্ড হবে secrets.txt-এর '=' এর পরের ৩২ অক্ষর, KEYSTORE_BASE64 হবে KEYSTORE_BASE64.txt-এর পুরো লেখা)।"
            head -n 3 "$RUNNER_TEMP/kt.log" | sed 's/^/keytool: /'
            exit 1
          fi
          # alias কী-স্টোর থেকেই নেওয়া হয় এবং কী-পাসওয়ার্ড স্টোর-পাসওয়ার্ডের সমান (PKCS12)
          KEY_ALIAS=$(grep -m1 "PrivateKeyEntry" "$RUNNER_TEMP/kt.log" | cut -d, -f1 | tr -d ' ')
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::কী-স্টোরে কোনো প্রাইভেট কী পাওয়া যায়নি"
            exit 1
          fi
          KEY_PASSWORD="$KEYSTORE_PASSWORD"
          export KEY_ALIAS KEY_PASSWORD
          echo "কী-স্টোর খোলা গেছে ✓ (alias: $KEY_ALIAS)"

          OUT="HisabFlow-${VERSION}.apk"
          "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.jks"

          "$BT/apksigner" verify --verbose --print-certs "$OUT" | tee cert.txt
          SHA=$(grep -m1 "certificate SHA-256 digest" cert.txt | sed 's/.*: //')
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          {
            echo "### HisabFlow ${VERSION} (build ${VERSION_CODE})"
            echo ""
            echo "- ধরন: ${{ steps.gradle.outputs.variant }}"
            echo "- সাইনিং সার্টিফিকেট SHA-256: \`${SHA}\`"
            echo ""
            echo "প্রতিটি বিল্ডে এই SHA-256 একই থাকলে আপডেট ডেটা না মুছে ইনস্টল হবে।"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "HisabFlow ${VERSION} — build ${VERSION_CODE}"
            echo ""
            echo "সাইনিং সার্টিফিকেট SHA-256:"
            echo "${SHA}"
            echo ""
            echo "আপডেট ইনস্টলের আগে সেটিংস থেকে ব্যাকআপ নিয়ে রাখুন।"
          } > release-notes.md

      # ---------- ৭) আর্টিফ্যাক্ট ও রিলিজ ----------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HisabFlow-APK
          path: ${{ steps.sign.outputs.apk }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build${{ github.run_number }}
          name: HisabFlow ${{ env.VERSION }} (build ${{ github.run_number }})
          body_path: release-notes.md
          files: ${{ steps.sign.outputs.apk }}
          
