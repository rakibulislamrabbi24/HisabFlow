name: Create signing key (একবারই চালান)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        run: |
          set -eu
          mkdir out
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          keytool -genkeypair \
            -keystore out/hisabflow-release.jks \
            -alias hisabflow -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=HisabFlow, O=HisabFlow, C=BD" > /dev/null 2>&1
          base64 -w0 out/hisabflow-release.jks > out/KEYSTORE_BASE64.txt
          printf 'KEYSTORE_PASSWORD=%s\nKEY_ALIAS=%s\nKEY_PASSWORD=%s\n' "$PASS" hisabflow "$PASS" > out/secrets.txt
          keytool -list -v -keystore out/hisabflow-release.jks -storepass "$PASS" 2>/dev/null | grep "SHA256:" > out/fingerprint.txt
          echo "কী তৈরি হয়েছে ✓ (SHA-256 ফিঙ্গারপ্রিন্ট নিচে)"
          cat out/fingerprint.txt

      - name: Upload key files (১ দিন থাকবে)
        uses: actions/upload-artifact@v4
        with:
          name: signing-key-ONE-TIME
          path: out/
          retention-days: 1
